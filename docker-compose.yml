services:
  postgres:
    image: postgres:16-alpine
    container_name: money-logger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: money_logger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host port 5434: 5432 is often a native PostgreSQL and 5433 is used by our Labs 1-4 (TokTickIT) database.
      - "5434:5432"
    volumes:
      - money_logger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_logger"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: money-logger-app:${APP_VERSION:-dev}
    container_name: money-logger-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/money_logger
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "8080:4000"

volumes:
  money_logger_pgdata:
